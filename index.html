
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor">
        <h1>Calculadora de Notas</h1>
        <p>Ingresa tus cuatro calificaciones</p>

        <div class="campo">
            <label>Primera nota (20%)</label>
            <input type="number" id="nota1" min="0" max="20" step="0.01">
        </div>

        <div class="campo">
            <label>Segunda nota (25%)</label>
            <input type="number" id="nota2" min="0" max="20" step="0.01">
        </div>

        <div class="campo">
            <label>Tercera nota (20%)</label>
            <input type="number" id="nota3" min="0" max="20" step="0.01">
        </div>

        <div class="campo">
            <label>Cuarta nota (35%)</label>
            <input type="number" id="nota4" min="0" max="20" step="0.01">
        </div>
         
        <button onclick="calcularNota()">Calcular promedio</button>
        <button onclick="limpiarNotas()">Limpiar notas</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
